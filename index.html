<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Grammar 1 (a - an) - الدرس الناطق التفاعلي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Comic Neue / Nunito for exact worksheet typography feel & Cairo for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --worksheet-bg: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fff3e0 0%, #f3e5f5 50%, #e1f5fe 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .worksheet-font {
            font-family: 'Comic Neue', 'Nunito', 'Fredoka', sans-serif;
            letter-spacing: 0.01em;
        }

        /* Worksheet Paper Frame */
        .poster-frame {
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(60, 40, 90, 0.18), 0 0 0 6px rgba(255, 255, 255, 0.95);
        }

        /* Dashed Columns matching the exact worksheet */
        .dashed-col-left {
            border: 3.5px dashed #3b6998;
            border-radius: 42px;
        }

        .dashed-col-right {
            border: 3.5px dashed #3d2c5e;
            border-radius: 42px;
        }

        /* Sentence Row Interactive Styling */
        .sentence-row {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 14px;
            position: relative;
        }

        .sentence-row:hover {
            background-color: rgba(243, 229, 245, 0.55);
            transform: translateX(3px);
        }

        .sentence-row.active-reading {
            background-color: #fff8e1;
            box-shadow: 0 4px 14px rgba(255, 152, 0, 0.22), 0 0 0 2.5px #ff9800;
            z-index: 20;
        }

        /* Sentence Row Interactive Styling - Static & Steady Highlight */
        .sentence-row {
            transition: background-color 0.15s ease;
            border-radius: 14px;
            position: relative;
        }

        .sentence-row:hover {
            background-color: rgba(243, 229, 245, 0.45);
        }

        .sentence-row.active-reading {
            background-color: #fff59d;
            box-shadow: 0 0 0 2.5px #fbc02d;
            z-index: 20;
        }

        /* Target Word Highlight when read (Fixed static highlight, NO scaling or jumping) */
        .target-word-box {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 8px;
        }

        .target-word-box.word-active {
            background-color: #ffe082;
            box-shadow: 0 0 0 2px #ffa000;
        }

        /* Interactive Blank (a / an) */
        .blank-slot {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            min-width: 58px;
            position: relative;
            cursor: pointer;
        }

        .blank-slot:hover .dots-text {
            color: #e65100;
        }

        .article-answer {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            font-weight: 900;
            pointer-events: none;
            padding: 0 8px;
            border-radius: 8px;
            line-height: 1;
            text-shadow: 0 1px 0 #ffffff, 0 -1px 0 #ffffff, 1px 0 0 #ffffff, -1px 0 0 #ffffff;
        }

        .article-answer.ans-an {
            color: #d81b60;
        }

        .article-answer.ans-a {
            color: #1565c0;
        }

        .blank-slot.show-answer .article-answer,
        .show-all-answers .article-answer {
            opacity: 1;
            transform: translateX(-50%);
        }

        .blank-slot.word-active .article-answer {
            background-color: #ffe082;
            box-shadow: 0 0 0 2px #ffa000;
            transform: translateX(-50%);
        }

        /* Floating Pointing Finger (100% Static on the word, NEVER sliding or bobbing) */
        #reading-finger {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            transform: translate(-50%, 0);
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.32));
        }

        #reading-finger.visible {
            opacity: 1;
        }

        #reading-finger.reading-active {
            transform: translate(-50%, 0);
        }

        .finger-ripple {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 3px solid #ff2e7e;
            background: rgba(255, 230, 0, 0.45);
            pointer-events: none;
        }

        /* 3D Title Letters (a - an) matching the poster sign */
        .sign-3d-text {
            font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
            color: #d7b8c4;
            -webkit-text-stroke: 2.5px #4a353b;
            text-shadow: 0 3px 0 #4a353b, 0 5px 8px rgba(0,0,0,0.18);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ff9800; border-radius: 99px; }
    </style>
</head>
<body class="py-3 px-2 sm:px-4 md:px-6 flex flex-col items-center">

    <!-- ==================== TOP INTERACTIVE CONTROL BAR ==================== -->
    <div class="w-full max-w-[880px] mb-3 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-orange-200 p-3 flex flex-wrap items-center justify-between gap-2 z-40 sticky top-2">

                <i class="fa-solid fa-microphone-lines text-purple-600"></i>
                <span id="read-mode-label">القراءة: الجملة كاملة</span>
            </button>

            <!-- Show/Hide (a - an) Answers (Shown by default) -->
            <button id="btn-answers" onclick="toggleShowAllAnswers()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-white bg-rose-600 hover:bg-rose-700 border border-rose-600 shadow-sm transition text-xs sm:text-sm" title="إظهار أو إخفاء إجابات a / an في الفراغات">
                <i class="fa-solid fa-check-double"></i>
                <span id="answers-label">الإجابات معروضة (a / an)</span>

        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
            <!-- Educational Teacher Voice Selector -->
            <div class="flex items-center gap-1 bg-amber-50 border border-amber-200 rounded-xl px-2.5 py-1.5">

            </div>

            <!-- Repeat Toggle -->

                <i class="fa-solid fa-repeat text-emerald-600"></i>
                <span id="repeat-label">النطق: مرة واحدة</span>
            </button>
        </div>
    </div>

        </svg>
    </div>

    <!-- ==================== APPLICATION LOGIC ==================== -->
    <script>
        /**
         * Complete dataset of all 22 sentences from "Top Grammar 1: a - an" (image_86ac58.jpg)
         * Preserves exact punctuation, dots count, column placement, and purple first letter.
         */
        const WORKSHEET_ITEMS = [
            // Left Column (1 - 11)
            { id: 1,  col: 'left',  word: 'ant',      article: 'an', dots: '.......',   hasSpaceBeforeDot: true,  hasDot: true },
            { id: 2,  col: 'left',  word: 'kite',     article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 3,  col: 'left',  word: 'bow',      article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 4,  col: 'left',  word: 'cake',     article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 5,  col: 'left',  word: 'ball',     article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 6,  col: 'left',  word: 'apple',    article: 'an', dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 7,  col: 'left',  word: 'arm',      article: 'an', dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 8,  col: 'left',  word: 'book',     article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 9,  col: 'left',  word: 'table',    article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 10, col: 'left',  word: 'eraser',   article: 'an', dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 11, col: 'left',  word: 'ring',     article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },

            // Right Column (12 - 22)
            { id: 12, col: 'right', word: 'pot',      article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 13, col: 'right', word: 'iron',     article: 'an', dots: '.........', hasSpaceBeforeDot: true,  hasDot: true },
            { id: 14, col: 'right', word: 'lion',     article: 'a',  dots: '.........', hasSpaceBeforeDot: false, hasDot: true },
            { id: 15, col: 'right', word: 'orange',   article: 'an', dots: '.....',     hasSpaceBeforeDot: true,  hasDot: true },
            { id: 16, col: 'right', word: 'axe',      article: 'an', dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 17, col: 'right', word: 'ray',      article: 'a',  dots: '........',  hasSpaceBeforeDot: true,  hasDot: true },
            { id: 18, col: 'right', word: 'way',      article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 19, col: 'right', word: 'nose',     article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 20, col: 'right', word: 'toy',      article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 21, col: 'right', word: 'ruler',    article: 'a',  dots: '........',  hasSpaceBeforeDot: false, hasDot: true },
            { id: 22, col: 'right', word: 'umbrella', article: 'an', dots: '.....',     hasSpaceBeforeDot: false, hasDot: false }
        ];

        // ==================== STATE MANAGEMENT ====================
        let activeRowId = null;
        let currentFingerTargetEl = null;
        let isAutoPlaying = false;
        let autoPlayTimeout = null;
        let stepTimers = [];
        let readFullSentence = true; // true = reads full sentence with natural educational flow, false = reads target word only
        let showAllAnswers = true;   // Answers (a / an) are placed and visible by default

        let speechRates = [
            { value: 0.84, label: "السرعة: تعليمي واضح" },
            { value: 0.68, label: "السرعة: بطيء للتأسيس" },
            { value: 0.98, label: "السرعة: طبيعي" }
        ];
        let currentSpeedIdx = 0;
        let repeatTwice = false;

        // ==================== RENDER WORKSHEET SENTENCES ====================
        function renderWorksheet() {
            const leftCol = document.getElementById('left-column');
            const rightCol = document.getElementById('right-column');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            WORKSHEET_ITEMS.forEach(item => {
                const firstLetter = item.word.charAt(0);
                const restOfWord = item.word.slice(1);
                const dotSuffix = item.hasDot ? (item.hasSpaceBeforeDot ? ' .' : '.') : '';
                const answerColorClass = item.article === 'an' ? 'ans-an' : 'ans-a';

                const rowEl = document.createElement('div');
                rowEl.id = `sentence-row-${item.id}`;
                rowEl.className = 'sentence-row py-1.5 px-1.5 sm:px-2 flex items-center justify-between gap-1 cursor-pointer select-none whitespace-nowrap overflow-hidden';

                rowEl.innerHTML = `
                    <div class="flex items-center flex-nowrap whitespace-nowrap worksheet-font text-[20px] sm:text-[24px] md:text-[26px] font-bold text-slate-900 leading-tight">
                        <!-- Red Arrow matching worksheet -->
                        <span class="inline-flex items-center mr-1.5 text-[#d32f2f] shrink-0" onclick="handleRowClick(event, ${item.id}, 'full')">
                            <svg width="22" height="18" viewBox="0 0 24 20" fill="none">
                                <path d="M2 7H13V2L23 10L13 18V13H2V7Z" fill="#d81b3a"/>
                            </svg>
                        </span>

                        <!-- "It is" whole phrase box -->
                        <span id="phrase-itis-${item.id}" class="target-word-box shrink-0" onclick="handleRowClick(event, ${item.id}, 'full')">It is</span>

                        <!-- Dotted Blank with Placed Answer (a / an) -->
                        <span id="blank-slot-${item.id}" class="blank-slot show-answer mx-0.5 shrink-0" onclick="handleBlankClick(event, ${item.id})" title="اضغط لسماع (${item.article} ${item.word})">
                            <span class="article-answer ${answerColorClass} text-[22px] sm:text-[26px]">${item.article}</span>
                            <span class="dots-text text-slate-400 tracking-tighter">${item.dots}</span>
                        </span>

                        <!-- Target Noun (First letter purple, rest black, rendered as ONE whole word so finger never moves on letters) -->
                        <span id="target-word-${item.id}" class="target-word-box shrink-0" onclick="handleWordOnlyClick(event, ${item.id})" title="اضغط لقراءة الكلمة (${item.word})">
                            <span class="text-[#5e2b87] font-black">${firstLetter}</span><span>${restOfWord}</span>
                        </span><span class="shrink-0">${dotSuffix}</span>
                    </div>

                    <!-- Speaker Icon for quick audio trigger -->
                    <button onclick="handleRowClick(event, ${item.id}, 'default')" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-orange-50 hover:bg-orange-100 text-orange-600 flex items-center justify-center text-xs transition shrink-0 ml-1" title="استمع للنطق الإنجليزي">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;

                if (item.col === 'left') {
                    leftCol.appendChild(rowEl);
                } else {
                    rightCol.appendChild(rowEl);
                }
            });
        }

        // ==================== STEADY POINTING FINGER POSITIONING ====================
        /**
         * Places the pointing finger steadily right underneath the target whole word element
         * WITHOUT moving across letters.
         */
        function placeFingerUnderElement(el) {
            const finger = document.getElementById('reading-finger');
            if (!el || !finger) return;

            currentFingerTargetEl = el;
            const rect = el.getBoundingClientRect();
            const targetX = rect.left + (rect.width / 2);
            const targetY = rect.bottom - 4;

            finger.style.left = `${targetX}px`;
            finger.style.top = `${targetY}px`;
            finger.classList.add('visible', 'reading-active');
        }

        function clearActiveHighlights() {
            document.querySelectorAll('.target-word-box, .blank-slot').forEach(el => el.classList.remove('word-active'));
        }

        function clearStepTimers() {
            stepTimers.forEach(t => clearTimeout(t));
            stepTimers = [];
        }

        // Keep finger aligned on scroll or window resize
        window.addEventListener('scroll', () => {
            if (currentFingerTargetEl) placeFingerUnderElement(currentFingerTargetEl);
        }, { passive: true });
        window.addEventListener('resize', () => {
            if (currentFingerTargetEl) placeFingerUnderElement(currentFingerTargetEl);
        });

        // ==================== EDUCATIONAL NATURAL VOICE ENGINE ====================
        let preferredEnglishVoice = null;
        let availableEnglishVoices = [];

        /**
         * Scores and ranks English TTS voices to select the clearest, most natural
         * educational teacher voice available on the user's device.
         */
        function scoreVoiceQuality(v) {
            let score = 0;
            const name = v.name.toLowerCase();
            const lang = v.lang.toLowerCase();

            if (!lang.startsWith('en')) return -999;

            // Prefer clear American or British standard English accents for EFL teaching
            if (lang === 'en-us' || lang === 'en_us') score += 35;
            else if (lang === 'en-gb' || lang === 'en_gb') score += 30;
            else score += 15;

            // Prioritize Neural / Online Natural / Premium Teacher Voices
            if (name.includes('natural')) score += 60;
            if (name.includes('online')) score += 40;
            if (name.includes('neural')) score += 50;
            if (name.includes('premium') || name.includes('enhanced')) score += 45;

            // Top-tier educational voices across Windows, macOS, iOS, Android, Chrome
            const topTeacherVoices = [
                'ava', 'aria', 'jenny', 'ana', 'sonia', 'libby', 'ryan', 'guy',
                'google us english', 'google uk english female', 'samantha',
                'allison', 'karen', 'daniel', 'moira', 'serena', 'zira'
            ];
            for (let i = 0; i < topTeacherVoices.length; i++) {
                if (name.includes(topTeacherVoices[i])) {
                    score += (35 - i);
                    break;
                }
            }

            // Avoid novelty or robotic compact voices
            if (name.includes('compact') || name.includes('espeak')) score -= 50;

            return score;
        }

        function loadPreferredEnglishVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            availableEnglishVoices = voices
                .filter(v => v.lang && v.lang.toLowerCase().startsWith('en'))
                .sort((a, b) => scoreVoiceQuality(b) - scoreVoiceQuality(a));

            if (availableEnglishVoices.length > 0) {
                preferredEnglishVoice = availableEnglishVoices[0];
            }

            // Populate the teacher voice selector dropdown
            const selectEl = document.getElementById('voice-select');
            if (selectEl && availableEnglishVoices.length > 0) {
                const currentVal = selectEl.value;
                selectEl.innerHTML = '';

                availableEnglishVoices.slice(0, 12).forEach((v, idx) => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    const cleanLabel = v.name
                        .replace(/Microsoft |Google |Apple /g, '')
                        .replace(/Online \(Natural\) - /g, '🌟 ')
                        .replace(/English /g, '');
                    opt.textContent = idx === 0 ? `🌟 ${cleanLabel} (أفضل صوت تعليمي)` : `🎙️ ${cleanLabel}`;
                    selectEl.appendChild(opt);
                });

                if (currentVal && currentVal !== 'auto' && availableEnglishVoices.some(v => v.name === currentVal)) {
                    selectEl.value = currentVal;
                    preferredEnglishVoice = availableEnglishVoices.find(v => v.name === currentVal);
                } else if (preferredEnglishVoice) {
                    selectEl.value = preferredEnglishVoice.name;
                }
            }
        }

        function handleVoiceChange(voiceName) {
            const found = availableEnglishVoices.find(v => v.name === voiceName);
            if (found) {
                preferredEnglishVoice = found;
                // Preview the selected voice on the currently active row or item 1
                readItem(activeRowId || 1, readFullSentence ? 'full' : 'word-only');
            }
        }

        if ('speechSynthesis' in window) {
            loadPreferredEnglishVoice();
            window.speechSynthesis.onvoiceschanged = loadPreferredEnglishVoice;
        }

        /**
         * Highlights a whole word/phrase element and places the steady finger underneath it.
         */
        function highlightAndPoint(targetEl) {
            clearActiveHighlights();
            if (targetEl) {
                targetEl.classList.add('word-active');
                placeFingerUnderElement(targetEl);
            }
        }

        /**
         * Speaks a single English word or natural sentence while keeping the highlight
         * and pointing finger 100% STATIC (fixed in place without jumping between words).
         */
        function speakEducationalFlow(item, mode, onEndCallback) {
            clearStepTimers();

            const blankEl = document.getElementById(`blank-slot-${item.id}`);
            const wordEl = document.getElementById(`target-word-${item.id}`);
            const rate = speechRates[currentSpeedIdx].value;

            // Keep the highlight and finger completely static on the target element
            const staticTargetEl = (mode === 'article-and-word') ? blankEl : wordEl;
            highlightAndPoint(staticTargetEl);

            let spokenText = `${item.article} ${item.word}`;
            if (mode === 'word-only') {
                spokenText = item.word;
            } else if (mode === 'full') {
                spokenText = `It is ${item.article} ${item.word}.`;
            }

            if (!('speechSynthesis' in window)) {
                stepTimers.push(setTimeout(() => { if (onEndCallback) onEndCallback(); }, 1000));
                return;
            }

            const utter = new SpeechSynthesisUtterance(spokenText);
            utter.lang = preferredEnglishVoice ? preferredEnglishVoice.lang : 'en-US';
            if (preferredEnglishVoice) utter.voice = preferredEnglishVoice;
            utter.rate = rate;
            utter.pitch = 1.04;

            utter.onend = () => {
                if (onEndCallback) onEndCallback();
            };
            utter.onerror = () => {
                if (onEndCallback) onEndCallback();
            };

            window.speechSynthesis.speak(utter);
        }

        // ==================== INTERACTION HANDLERS ====================
        function handleWordOnlyClick(event, itemId) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            readItem(itemId, 'word-only');
        }

        function handleBlankClick(event, itemId) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            const blankEl = document.getElementById(`blank-slot-${itemId}`);
            if (blankEl) {
                blankEl.classList.add('show-answer');
            }
            readItem(itemId, 'article-and-word');
        }

        function handleRowClick(event, itemId, mode) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            const effectiveMode = mode === 'default'
                ? (readFullSentence ? 'full' : 'word-only')
                : mode;
            readItem(itemId, effectiveMode);
        }

        /**
         * Reads an item in English only, placing the steady finger under each whole word
         * without ever moving across letters.
         */
        function readItem(itemId, mode, onComplete) {
            const item = WORKSHEET_ITEMS.find(x => x.id === itemId);
            if (!item) return;

            clearStepTimers();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            activeRowId = itemId;
            document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-reading'));
            const rowEl = document.getElementById(`sentence-row-${itemId}`);
            if (rowEl) rowEl.classList.add('active-reading');

            const runSinglePass = (donePass) => {
                speakEducationalFlow(item, mode, donePass);
            };

            runSinglePass(() => {
                if (repeatTwice && activeRowId === itemId) {
                    stepTimers.push(setTimeout(() => {
                        if (activeRowId !== itemId) return;
                        runSinglePass(() => {
                            if (onComplete) onComplete();
                        });
                    }, 400));
                } else {
                    if (onComplete) onComplete();
                }
            });
        }

        // ==================== SEQUENTIAL AUTO-PLAY (1 TO 22) ====================
        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            isAutoPlaying = true;
            updateAutoPlayButtonUI();

            let currentIndex = 0;

            function playNext() {
                if (!isAutoPlaying || currentIndex >= WORKSHEET_ITEMS.length) {
                    stopAutoPlay();
                    return;
                }

                const item = WORKSHEET_ITEMS[currentIndex];
                const rowEl = document.getElementById(`sentence-row-${item.id}`);
                if (rowEl) {
                    rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                setTimeout(() => {
                    if (!isAutoPlaying) return;
                    const mode = readFullSentence ? 'full' : 'word-only';
                    readItem(item.id, mode, () => {
                        if (!isAutoPlaying) return;
                        currentIndex++;
                        autoPlayTimeout = setTimeout(playNext, 550);
                    });
                }, 150);
            }

            playNext();
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearStepTimers();
            if (autoPlayTimeout) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            updateAutoPlayButtonUI();
        }

        function updateAutoPlayButtonUI() {
            const btn = document.getElementById('btn-auto-play');
            const icon = document.getElementById('icon-auto-play');
            const text = document.getElementById('text-auto-play');

            if (isAutoPlaying) {
                icon.className = 'fa-solid fa-stop';
                text.textContent = 'إيقاف القراءة الآلية';
            } else {
                icon.className = 'fa-solid fa-play';
                text.textContent = 'قراءة الكل بالترتيب';
            }
        }

        // ==================== TOOLBAR CONTROLS ====================
        function toggleReadScope() {
            readFullSentence = !readFullSentence;
            const label = document.getElementById('read-mode-label');
            label.textContent = readFullSentence ? 'القراءة: الجملة كاملة' : 'القراءة: الكلمة فقط';
        }

        function toggleShowAllAnswers() {
            showAllAnswers = !showAllAnswers;
            const container = document.getElementById('poster-container');
            const btn = document.getElementById('btn-answers');
            const label = document.getElementById('answers-label');
            container.classList.toggle('show-all-answers', showAllAnswers);
            document.querySelectorAll('.blank-slot').forEach(el => {
                el.classList.toggle('show-answer', showAllAnswers);
            });
            if (showAllAnswers) {
                label.textContent = 'الإجابات معروضة (a / an)';
                btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-white bg-rose-600 hover:bg-rose-700 border border-rose-600 shadow-sm transition text-xs sm:text-sm';
            } else {
                label.textContent = 'إظهار الحل (a / an)';
                btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-rose-800 bg-rose-100 hover:bg-rose-200 border border-rose-200 transition text-xs sm:text-sm';
            }
        }

        function cycleSpeechSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % speechRates.length;
            document.getElementById('speed-label').textContent = speechRates[currentSpeedIdx].label;
        }

        function toggleRepeatWord() {
            repeatTwice = !repeatTwice;
            const label = document.getElementById('repeat-label');
            label.textContent = repeatTwice ? 'النطق: مرتان للحفظ' : 'النطق: مرة واحدة';
        }

        // ==================== EXACT HEADER IMAGE EXTRACTOR ====================
        /**
         * If `image_86ac58.jpg` is available in the environment, crops the top header banner
         * (with the boy, girl, puzzle pieces, and "a - an" sign) at ultra-crisp resolution.
         */
        function tryAutoLoadWorksheetHeader() {
            const paths = ['image_86ac58.jpg', './image_86ac58.jpg'];
            paths.forEach(path => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    if (img.naturalWidth > 100) {
                        const canvas = document.createElement('canvas');
                        const cropH = Math.round(img.naturalHeight * 0.202);
                        canvas.width = img.naturalWidth * 2;
                        canvas.height = cropH * 2;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, img.naturalWidth, cropH, 0, 0, canvas.width, canvas.height);

                        const headerBox = document.getElementById('header-illustration-container');
                        if (headerBox) {
                            headerBox.innerHTML = `<img src="${canvas.toDataURL('image/png')}" alt="Top Grammar 1 a - an" class="w-full h-auto block" />`;
                        }
                    }
                };
                img.src = path;
            });
        }

        // Initialize on Window Load
        window.onload = function() {
            renderWorksheet();
            tryAutoLoadWorksheetHeader();
        };
    </script>
